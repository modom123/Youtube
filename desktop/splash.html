<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: rgba(10,10,10,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
    color: #f5f5f5;
    border-radius: 16px;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }
  .logo {
    width: 72px;
    height: 72px;
    background: #d4a017;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    color: #0a0a0a;
    margin-bottom: 20px;
    letter-spacing: -2px;
  }
  .title {
    font-size: 18px;
    font-weight: 700;
    color: #f5f5f5;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 12px;
    color: #666;
    margin-bottom: 28px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2a2a2a;
    border-top-color: #d4a017;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">S</div>
  <div class="title">Social Money</div>
  <div class="sub">Starting up…</div>
  <div class="spinner"></div>
</body>
</html>
