<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Social Optimize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .auth-box { width: 100%; max-width: 400px; padding: 24px; }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo .icon { font-size: 40px; }
    .auth-logo h1 { font-size: 22px; font-weight: 800; margin: 8px 0 4px; }
    .auth-logo p { color: var(--muted); font-size: 13px; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
    .auth-card h2 { font-size: 18px; font-weight: 700; margin: 0 0 20px; }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
    .form-row input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 11px 14px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
    .form-row input:focus { outline: none; border-color: var(--accent); }
    .auth-btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 700; margin-top: 4px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .flash-msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; background: rgba(255,59,48,.12); color: #ff453a; border: 1px solid rgba(255,59,48,.3); }
    .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
<div class="auth-box">
  <div class="auth-logo">
    <div class="icon">🎬</div>
    <h1><span style="color:var(--accent)">Social</span> Optimize</h1>
    <p>AI-powered content creation studio</p>
  </div>
  <div class="auth-card">
    <h2>Sign in</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash-msg">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-row">
        <label>Email</label>
        <input type="email" name="email" required autofocus placeholder="you@example.com" />
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••" />
      </div>
      <label class="remember-row">
        <input type="checkbox" name="remember" /> Remember me
      </label>
      <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
    </form>
  </div>
  <div class="auth-footer">
    Don't have an account? <a href="{{ url_for('auth.register') }}">Create one free</a>
  </div>
</div>
</body>
</html>
